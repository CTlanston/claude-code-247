<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.4 system-ui, -apple-system, "Helvetica Neue", sans-serif;
           margin: 0; padding: 24px; max-width: 980px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    nav a { margin-right: 12px; color: #06c; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e3e3e3; }
    th { font-weight: 600; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 12px; background: #eee; }
    .pill.on { background: #cfe8c2; }
    .pill.off { background: #f1c2c2; }
    .pill.warn { background: #fbe6a2; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    footer { margin-top: 32px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Overview</a>
    <a href="/repos">Repos</a>
    <a href="/tasks">Tasks</a>
    <a href="/healthz">Health</a>
  </nav>
  <h1>{{ title }}</h1>
  {% block body %}{% endblock %}
  <footer>claude-code-247 v1 · local-first 24/7 coding coworker</footer>
</body>
</html>
