{% extends "base.html" %}
{% block body %}
<table>
  <tr><th>Auth mode</th><td><code>{{ auth_mode }}</code></td></tr>
  <tr><th>allow_remote_writes</th><td>
    {% if allow_remote_writes %}<span class="pill on">on</span>{% else %}<span class="pill off">off</span>{% endif %}
  </td></tr>
  <tr><th>Repos</th><td>{{ enabled_repos }} enabled / {{ repo_count }} total</td></tr>
  <tr><th>Tasks</th><td>{{ task_count }}</td></tr>
  <tr><th>Pending commands</th><td>{{ pending_commands }}</td></tr>
  <tr><th>State DB</th><td><code>{{ db_path }}</code></td></tr>
</table>
{% endblock %}
