{% extends "base.html" %}
{% block body %}
{% if tasks %}
<table>
  <thead><tr><th>ID</th><th>Repo</th><th>Goal</th><th>Status</th><th>Created</th></tr></thead>
  <tbody>
  {% for t in tasks %}
    <tr>
      <td><code>{{ t["id"] }}</code></td>
      <td><code>{{ t["repo_id"] }}</code></td>
      <td>{{ t["goal"] }}</td>
      <td>{{ t["status"] }}</td>
      <td>{{ t["created_at"] }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p>No tasks yet.</p>
{% endif %}
{% include "_pagination.html" %}
{% endblock %}
