<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aedev</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      nav { display: flex; gap: 1px; background: rgba(255,255,255,.82); backdrop-filter: blur(18px); border-bottom: 1px solid #d8d8de; position: sticky; top: 0; z-index: 2; }
      nav button { padding: 11px 18px; background: transparent; border: none; color: #6e6e73; cursor: pointer; font-size: 14px; }
      nav button.active { color: #1d1d1f; border-bottom: 2px solid #0071e3; }
      .page { padding: 24px; max-width: 1680px; }
      h1 { font-size: 28px; font-weight: 700; letter-spacing: 0; margin-bottom: 8px; }
      .card, .panel { background: rgba(255,255,255,.88); border: 1px solid #d9dde6; border-radius: 12px; padding: 18px; margin-bottom: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.05); }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
      .badge-draft { background: #374151; color: #9ca3af; }
      .badge-approved { background: #064e3b; color: #6ee7b7; }
      .badge-running { background: #1e3a5f; color: #93c5fd; }
      .badge-done { background: #14532d; color: #86efac; }
      .badge-failed { background: #450a0a; color: #fca5a5; }
      .badge-pending { background: #451a03; color: #fdba74; }
      button.action { background: #0071e3; color: #fff; border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 650; margin-right: 6px; }
      button.action.primary { background: #111827; color: #fff; }
      button.action.secondary { background: #e8eef8; color: #1d1d1f; }
      button.action:hover { filter: brightness(1.05); }
      button.action:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
      button.action.danger { background: #ef4444; }
      .error { color: #b91c1c; padding: 14px 16px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; margin-bottom: 14px; }
      .notice { color: #1d4ed8; padding: 12px 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; margin-bottom: 14px; font-size: 14px; }
      .empty { color: #86868b; padding: 16px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; }
      .dot.off { background: #ef4444; }
      .eyebrow { color: #0071e3; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
      .cockpit-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
      .cockpit-top h1 { margin-bottom: 4px; }
      .cockpit-top p { color: #6e6e73; font-size: 15px; }
      .health-strip { display: flex; gap: 14px; align-items: center; color: #6e6e73; background: rgba(255,255,255,.9); border: 1px solid #d9dde6; padding: 10px 14px; border-radius: 999px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.04); }
      .health-strip strong { color: #1d1d1f; }
      .coach-card { display: flex; justify-content: space-between; align-items: center; gap: 20px; background: #fff; border: 1px solid #d9dde6; border-radius: 18px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 14px 44px rgba(0,0,0,.06); }
      .coach-card.warn { background: #fff7ed; border-color: #fed7aa; }
      .coach-card span { display: block; color: #0071e3; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
      .coach-card strong { display: block; font-size: 19px; margin-bottom: 4px; }
      .coach-card p { color: #6e6e73; font-size: 14px; line-height: 1.45; }
      .coach-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .cockpit-grid { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(420px, 1.25fr) minmax(320px, 0.9fr); gap: 14px; align-items: start; }
      .panel { min-height: 520px; margin: 0; }
      .panel-title, .subhead { font-size: 12px; color: #6e6e73; text-transform: uppercase; letter-spacing: .04em; font-weight: 800; margin-bottom: 12px; }
      label { display: block; color: #6e6e73; font-size: 12px; margin: 10px 0 5px; }
      input, select, textarea { width: 100%; background: #fbfbfd; border: 1px solid #d1d5db; color: #1d1d1f; border-radius: 10px; padding: 9px 11px; font: inherit; }
      textarea { min-height: 150px; resize: vertical; line-height: 1.4; }
      .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .message-list { display: grid; gap: 8px; margin-top: 12px; }
      .choice-bar { background: #f5f8ff; border: 1px solid #c7d2fe; border-radius: 14px; padding: 10px; margin-top: 10px; display: grid; gap: 8px; }
      .choice-bar span { color: #1d4ed8; font-size: 12px; font-weight: 800; }
      .choice-bar button { border: none; border-radius: 999px; background: #fff; color: #1d1d1f; padding: 8px 10px; cursor: pointer; border: 1px solid #d9dde6; }
      .message { border: 1px solid #e0e4ec; border-radius: 14px; padding: 12px; background: #fbfbfd; }
      .message.assistant { background: #f5f8ff; }
      .message span { display: block; color: #0071e3; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
      .message p { color: #1f2937; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
      .timeline { margin-bottom: 14px; }
      .stage { display: inline-flex; align-items: center; min-height: 28px; padding: 5px 9px; border-radius: 999px; margin: 0 6px 6px 0; font-size: 12px; color: #6e6e73; background: #f5f5f7; border: 1px solid #d9dde6; }
      .stage.done { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
      .stage.active { color: #fff; background: #0071e3; border-color: #0071e3; }
      .progress { height: 8px; background: #f1f5f9; border: 1px solid #e5e7eb; border-radius: 999px; overflow: hidden; margin: 6px 0 8px; }
      .progress span { display: block; height: 100%; background: #34c759; }
      .mission-meta, .running { color: #6e6e73; font-size: 13px; }
      .agent-activity { background: #fbfbfd; border: 1px solid #e0e4ec; border-radius: 14px; padding: 12px; margin: 12px 0; }
      .agent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
      .agent-pill { border: 1px solid #e0e4ec; background: #fff; border-radius: 12px; padding: 10px; }
      .agent-pill.active { border-color: #0071e3; background: #eff6ff; }
      .agent-pill strong { display: block; font-size: 13px; }
      .agent-pill span { color: #6e6e73; font-size: 12px; }
      .activity-feed { display: grid; gap: 6px; }
      .activity-feed div, .activity-feed p { color: #6e6e73; font-size: 12px; }
      .snapshot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
      .snapshot div, .metric-row { background: #fbfbfd; border: 1px solid #e0e4ec; border-radius: 12px; padding: 10px; }
      .snapshot span, .metric-row span { display: block; color: #6e6e73; font-size: 12px; margin-bottom: 4px; }
      .snapshot strong, .metric-row strong { color: #1d1d1f; font-size: 13px; overflow-wrap: anywhere; }
      .run-panel p { color: #6e6e73; font-size: 13px; line-height: 1.45; margin-bottom: 8px; }
      .validator, .artifact, .event, .approval-card, .execution-monitor, .doc-preview { border: 1px solid #e0e4ec; border-radius: 12px; padding: 10px; margin-bottom: 8px; background: #fbfbfd; }
      .validator.pass { border-color: #166534; }
      .validator.fail, .validator.inconclusive { border-color: #854d0e; }
      .artifact span { display: inline-block; width: 72px; color: #38bdf8; font-size: 12px; font-weight: 700; }
      .artifact strong { display: block; margin: 2px 0 4px; color: #1d1d1f; }
      button.artifact { width: 100%; text-align: left; color: inherit; cursor: pointer; }
      button.artifact.active, button.artifact:hover { border-color: #38bdf8; }
      .doc-preview { margin-top: 14px; }
      .doc-preview pre { max-height: 360px; overflow: auto; white-space: pre-wrap; background: #fff; border: 1px solid #e0e4ec; border-radius: 12px; padding: 12px; color: #1f2937; font-size: 12px; line-height: 1.45; }
      .worker-log { max-height: 240px; overflow: auto; white-space: pre-wrap; background: #111827; border: 1px solid #111827; border-radius: 12px; padding: 10px; color: #e5e7eb; font-size: 11px; line-height: 1.4; margin-top: 8px; }
      .preview-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .preview-tabs button { background: #fff; border: 1px solid #d9dde6; color: #1d1d1f; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
      .preview-tabs button.active { background: #0071e3; color: #fff; border-color: #0071e3; }
      code { color: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
      .event strong { display: block; color: #1d1d1f; font-size: 12px; margin-bottom: 4px; }
      .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .choice-bar .choice-row button { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; }
      .choice-bar .choice-row button strong { font-size: 13px; font-weight: 650; color: #1d1d1f; }
      .choice-bar .choice-row button em { font-style: normal; color: #6e6e73; font-size: 11px; }
      .activity-row { display: flex; flex-direction: column; gap: 1px; padding: 7px 9px; background: #fff; border: 1px solid #e7ebf3; border-radius: 10px; }
      .activity-row strong { color: #1d1d1f; font-size: 12px; font-weight: 600; }
      .activity-row span { color: #6e6e73; font-size: 11px; }
      details.raw-events { margin-top: 10px; border: 1px solid #e0e4ec; border-radius: 12px; background: #fbfbfd; padding: 6px 10px; }
      details.raw-events > summary { cursor: pointer; color: #6e6e73; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 4px 0; }
      details.raw-events .event { margin-top: 8px; }
      button.action.pulse { animation: cockpit-pulse 1.4s ease-in-out infinite; }
      @keyframes cockpit-pulse {
        0% { box-shadow: 0 0 0 0 rgba(0,113,227,.45); }
        70% { box-shadow: 0 0 0 9px rgba(0,113,227,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,113,227,0); }
      }
      @media (max-width: 1100px) { .cockpit-grid { grid-template-columns: 1fr; } .panel { min-height: auto; } .cockpit-top { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
