# claude-code-247 system config. Lives at ~/.claude-code-247/config.yaml.
# This file is the documented default and ships with the package; the loader
# merges user overrides on top. Anything not overridden falls back to here.

system:
  # The safety gate. When false, the orchestrator will never push branches,
  # create PRs, comment on PRs, or merge anything. All other code paths
  # (planning, coding, validating, scoring, evidence) still run so the user
  # can review locally.
  allow_remote_writes: false

  # Where to bind the dashboard. Listen on loopback by default for safety.
  dashboard_host: 127.0.0.1
  dashboard_port: 7247

  # The orchestrator polls the command queue + task scheduler at this rate.
  poll_interval_seconds: 30

  # How many days of operational data to keep online before GC.
  workspace_gc_days: 14
  log_gc_days: 30

auth:
  # legacy field kept for backwards compatibility with older configs;
  # use worker_mode / allow_api_fallback below for new installs.
  mode: local_claude_code
  api_fallback_requires_approval: true

  # M18-P0 honest-mode controls.
  #
  # worker_mode chooses which path planner/coder/reviewer take:
  #   local_claude_code — invoke `claude --print` and let the CLI pick
  #                       its credential (keychain OAuth, subscription,
  #                       or apiKeyHelper). ANTHROPIC_API_KEY is
  #                       STRIPPED from the subprocess env so the CLI
  #                       cannot silently use it.
  #   anthropic_api     — invoke `claude --print` with ANTHROPIC_API_KEY
  #                       present. Per-call cost is reported and warned.
  worker_mode: local_claude_code

  # When true, the runner may silently fall back from local_claude_code
  # to anthropic_api if the local path fails. Default false — fail
  # loudly so the operator fixes the auth setup intentionally.
  allow_api_fallback: false

  # When allow_api_fallback is true, the orchestrator still requires an
  # explicit per-call approval token unless this is also set to false.
  require_explicit_api_fallback: true

  # Doctor prints a one-line cost warning whenever a real API call is
  # about to happen (or has happened). Off in fully-quiet operations.
  show_cost_warnings: true

cost:
  # Per-day caps before the system pauses the offending repo.
  default_daily_api_usd_cap: 0.0           # 0 = no API budget by default
  premium_guardian_allowed: false

validators:
  gemini:
    enabled: true
    model: gemini-2.5-pro
    # When true, a real Gemini PASS is REQUIRED for auto-merge — a
    # mock pass cannot silently substitute. The mock adapter is still
    # safe for dev/test; production should keep this true.
    require_real_for_auto_merge: true
  openai:
    enabled: true
    # M20-P3d: reduced from `gpt-5` (org-gated) to `gpt-4o` which is
    # widely available. Overridable per operator config.
    model: gpt-4o
    require_real_for_auto_merge: true

  # When both are enabled, both must PASS for auto-merge. Disagreement
  # forces approval. When fewer than 2 are enabled, auto-merge is blocked.
  require_two_validators: true

  # M18-P1 mock gate. When false (default), validation_policy.validate
  # refuses ok_for_auto_merge=True if ANY result's validator name ends
  # with "-mock". Set to true ONLY in dev/test scripts that need to
  # exercise the auto-merge path without spending on real APIs.
  allow_mock_validators_for_auto_merge: false

notifications:
  ntfy:
    # If set, all notifications also push here. Empty = local-log only.
    topic: ""
    server: https://ntfy.sh
  # Dedup window: a fingerprint repeats within this many minutes -> coalesce.
  dedup_window_minutes: 30

github:
  # Shared secret used to verify HMAC-SHA256 signatures on incoming
  # webhooks. Configure the SAME value in the GitHub repo's webhook
  # settings. Empty = /webhooks/github returns 503.
  webhook_secret: ""

# Per-repo defaults. Each repo in repos.yaml inherits these unless overridden.
repo_defaults:
  default_branch: main
  enabled: true
  risk_level: low

  test_commands: []
  lint_commands: []
  build_commands: []

  allowed_paths:
    - "**"
  forbidden_paths:
    - ".env"
    - ".env.*"
    - ".github/**"
    - "secrets/**"
    - "CLAUDE.md"
    - "AGENTS.md"

  auto_merge:
    enabled: false                         # opt-in per repo
    max_risk_score: 30
    max_changed_lines: 300
    require_tests: true
    require_two_validators: true

  budget:
    max_tasks_per_day: 5
    max_worker_runs_per_day: 20
    max_validator_runs_per_day: 20
    max_repair_attempts_per_task: 3

  notifications:
    ntfy_topic: ""
    notify_on:
      - task_started
      - task_stuck
      - pr_created
      - validation_failed
      - auto_merge_completed
      - human_approval_required

# CC_RESTORE_SPEC §3 T3 — RoadmapAgent scope + cap.
# Bounds the scanner so it cannot treat the whole docs tree as a roadmap.
# scope_paths is an explicit allowlist; any path outside this list is
# rejected at the scanner boundary. max_proposals_per_tick is the emission
# ceiling per tick; over-cap surfaces hold.policy.created with reason
# roadmap_scan_overflow so the operator triages.
roadmap_agent:
  scope_paths:
    - "docs/roadmap.md"
  max_proposals_per_tick: 5

# WORKBOOK_v4 P1 — Agent SDK credit guard (headless `claude --print` budget).
# The daemon reads these limits from the environment (env is authoritative);
# this block documents the knobs and their defaults. From 2026-06-15 headless
# calls consume a separate non-rollover Agent SDK monthly credit, so every
# call is recorded as a `cost.headless_call` event and capped. Over budget →
# HOLD-BUDGET + ntfy; never a silent paid-API fallback.
budget:
  # AEDEV_BUDGET_MAX_HEADLESS_PER_MISSION (default 15)
  max_headless_calls_per_mission: 15
  # AEDEV_BUDGET_MAX_HEADLESS_PER_DAY (default 60)
  max_headless_calls_per_day: 60
