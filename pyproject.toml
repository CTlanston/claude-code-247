[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-247"
version = "1.0.0-alpha.0"
description = "Local-first, multi-repo, 24/7 autonomous coding coworker driven by Claude Code"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lanston", email = "ctlanston@gmail.com" }]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.0",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
]
vector = [
  "qdrant-client>=1.11",
]
github = [
  "PyGithub>=2.4",
]

[project.scripts]
claude247 = "gateway.cli:main"

[tool.setuptools]
packages = [
  "orchestrator",
  "gateway",
  "gateway.commands",
  "dashboard",
  "dashboard.routes",
  "runner",
  "validator",
  "memory",
]
include-package-data = true

[tool.setuptools.package-data]
memory = ["schema.sql"]
dashboard = ["templates/*.html", "templates/**/*.html", "static/*"]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
  "external: tests that hit real external services (deselect by default)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "SIM"]
ignore = ["E501"]
